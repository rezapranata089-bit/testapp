name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo $KEYSTORE_BASE64 | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Configure build.gradle for Release Signing
        run: |
          python3 -c "
          import re
          with open('android/app/build.gradle', 'r') as f:
              c = f.read()
          if 'keystoreProperties' not in c:
              props = '''
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          '''
              c = c.replace('android {', props + '\nandroid {')
              cfg = '''
              signingConfigs {
                  release {
                      keyAlias = keystoreProperties['keyAlias']
                      keyPassword = keystoreProperties['keyPassword']
                      storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword = keystoreProperties['storePassword']
                  }
              }'''
              c = c.replace('buildTypes {', cfg + '\n    buildTypes {')
              c = re.sub(r'(signingConfig\s*=?\s*signingConfigs)\.debug', r'\1.release', c)
              with open('android/app/build.gradle', 'w') as f:
                  f.write(c)
          "

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
